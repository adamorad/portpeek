name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'PortPeek-web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: PortPeek-web/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: PortPeek-web
        run: npm ci

      - name: Build
        working-directory: PortPeek-web
        # base_url is "/" when a custom domain is configured, otherwise "/<repo>/"
        run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: PortPeek-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
